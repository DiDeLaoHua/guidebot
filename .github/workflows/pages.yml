# pages.yml
# =============================================================================
# GitHub Actions / Публикация GitHub Pages
# =============================================================================

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Сборка статического сайта
        run: |
          mkdir -p _site
          cp index.html chat.html register.html referrals.html 404.html .nojekyll _site/
          cp -r css js _site/
          if [ -d images ]; then cp -r images _site/; fi

      - name: Настройка Pages
        uses: actions/configure-pages@v4

      - name: Загрузка артефакта
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Деплой Pages
        id: deployment
        uses: actions/deploy-pages@v4